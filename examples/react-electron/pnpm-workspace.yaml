# While Expo doesn't require hoisted anymore, Electron still needs it.
# https://www.electronjs.org/docs/latest/tutorial/tutorial-first-app#initializing-your-npm-project
nodeLinker: hoisted

allowBuilds:
  # Electron downloads its binary the first time it starts, and pnpm asks
  # about it although Electron 42 and later have no install script.
  electron: false
  electron-winstaller: true
  esbuild: true
