name: Docker

# Builds the relay image from the published package, as
# docs/adr/relay-image-installs-published-package.md decides. Each finished
# Release run on main starts it, so its wait for approval never holds Release.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-docker
  cancel-in-progress: false

env:
  IMAGE: docker.io/evoluhq/relay

jobs:
  version:
    name: Relay version
    # A failed Release run may not have staged the relay. A Release run of a
    # fork's pull request can have a branch named main too.
    if: >-
      github.repository == 'evoluhq/evolu' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      # A rerun of an older Release run builds that run's relay, not main's.
      # A manual run has no head_sha and checks out main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read the relay version
        id: version
        run: |
          version=$(jq -r .version apps/relay/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only a run whose image is missing needs the push job, whose environment
      # asks for approval.
      - name: Look up the image on Docker Hub
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/evoluhq/repositories/relay/tags/$VERSION")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Docker Hub lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

  push:
    name: Push relay image
    needs: version
    # A manual run always runs this job, which repairs an existing image's tags.
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    # The environment holds the Docker Hub token. Only main can use it, and each
    # run needs the maintainer's approval, given after approving the staged
    # relay on npm. Its Prevent self-review stays off, as the maintainer, its
    # only reviewer, starts the runs and reruns.
    environment: docker-hub
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Recheck on every attempt, including reruns of only this failed job.
      - name: Check Docker Hub for the relay version
        id: image
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/evoluhq/repositories/relay/tags/$VERSION")
          case "$status" in
            200)
              digest=$(jq -er '.digest | select(type == "string") | select(test("^sha256:[0-9a-f]{64}$"))' "$response")
              echo "$IMAGE:$VERSION already exists at $digest"
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Docker Hub lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      # npm serves a staged release only once a maintainer approves it, its CDN
      # caches each package's version list for up to five minutes, a new
      # release can take longer to appear, and its tarball can return 404 for
      # minutes after npm lists it, so wait until npm can download the relay and
      # each @evolu package it depends on, as npm install does. If the npm
      # approval comes later, rerun this job.
      - name: Wait for npm to serve @evolu/relay@${{ env.VERSION }}
        if: steps.image.outputs.published == 'false'
        run: |
          is_served() {
            dependencies=$(npm view "@evolu/relay@$VERSION" dependencies --json 2>/dev/null) || return 1
            for package in "@evolu/relay@$VERSION" $(jq -r 'to_entries[] | select(.key | startswith("@evolu/")) | "\(.key)@\(.value)"' <<< "$dependencies"); do
              npm pack "$package" --dry-run --prefer-online > /dev/null 2>&1 || return 1
            done
          }
          for _ in $(seq 1 90); do
            if is_served; then exit 0; fi
            sleep 10
          done
          echo "npm did not serve @evolu/relay@$VERSION and its @evolu dependencies after 90 attempts. If it awaits approval on npm, rerun this job after approving it." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.image.outputs.published == 'false'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The builds use no cache, as jobs on main that run dependency code can
      # write the Actions cache this job would read.
      - name: Build amd64 image for the smoke test
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          load: true
          tags: evolu/relay:smoke

      - name: Smoke test on a custom port
        if: steps.image.outputs.published == 'false'
        run: |
          container=$(docker run --detach \
            --env PORT=4001 \
            --health-interval=1s --health-start-period=1s --health-retries=20 \
            evolu/relay:smoke)
          trap 'docker rm --force --volumes "$container" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            case "$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")" in
              "running healthy")
                docker exec "$container" test -s /app/data/evolu-relay.db
                exit 0
                ;;
              "running starting")
                sleep 1
                ;;
              *)
                break
                ;;
            esac
          done
          docker logs "$container"
          exit 1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - name: Push multi-arch image
        id: push
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Reconcile image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest || steps.push.outputs.digest }}
        run: |
          # A rerun of an older release must not move stable aliases backwards.
          git fetch --no-tags --depth=1 origin main
          current_version=$(git show FETCH_HEAD:apps/relay/package.json | jq -er .version)
          args=()
          while IFS= read -r tag; do
            if [ "$current_version" != "$VERSION" ] && [ "$tag" != "$IMAGE:$VERSION" ]; then continue; fi
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=false \
            "${args[@]}" "$IMAGE@$DIGEST"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest || steps.push.outputs.digest }}
        run: |
          {
            echo "### Relay image"
            echo
            for tag in $TAGS; do echo "- $tag"; done
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
