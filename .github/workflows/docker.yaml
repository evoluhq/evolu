name: Docker

# Builds the relay image from the published package, as
# docs/adr/relay-image-installs-published-package.md decides, once npm serves
# it, which npm does only after a maintainer approves the staged release. Each
# finished Release run on main starts it to watch npm for that run's relay
# version, so the image follows a prompt approval within minutes. An hourly run
# checks main's relay version once, which picks up a later approval. It runs at
# minute 17, as GitHub delays scheduled runs at the start of an hour.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

env:
  IMAGE: docker.io/evoluhq/relay

jobs:
  version:
    name: Relay version
    # A failed Release run may not have staged the relay. A Release run of a
    # fork's pull request can have a branch named main too.
    if: >-
      github.repository == 'evoluhq/evolu' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # A run after Release watches npm for 330 minutes, which leaves 25 minutes
    # of GitHub's 6-hour limit for a job for setup and a slow last npm call.
    timeout-minutes: 355
    # Runs after Release watch one at a time, and only the newest waiting one is
    # kept, so pushes to main during a slow approval don't each hold a runner.
    # The newest reads main's newest relay version, and the hourly run picks up
    # an approval no watch saw.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && 'relay-docker-watch' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
      served: ${{ steps.npm.outputs.served }}
    steps:
      # A run after Release reads that run's relay version, also when rerun. A
      # scheduled or manual run has no head_sha and checks out main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read the relay version
        id: version
        run: |
          version=$(jq -r .version apps/relay/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only a missing image needs the npm check. A manual run whose image exists
      # repairs its tags.
      - name: Look up the image on Docker Hub
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/evoluhq/repositories/relay/tags/$VERSION")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Docker Hub lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      # npm serves a staged release only once a maintainer approves it, and its
      # tarball can return 404 for minutes after npm lists it, so check that npm
      # can download the relay and each @evolu package it depends on, as npm
      # install does. A run after Release checks every 30 seconds for 330
      # minutes; other runs check once.
      - name: Check that npm serves the relay
        id: npm
        if: steps.exists.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WATCH_SECONDS: ${{ github.event_name == 'workflow_run' && 19800 || 0 }}
        run: |
          is_served() {
            dependencies=$(npm view "@evolu/relay@$VERSION" dependencies --json 2>/dev/null) || return 1
            for package in "@evolu/relay@$VERSION" $(jq -r 'to_entries[] | select(.key | startswith("@evolu/")) | "\(.key)@\(.value)"' <<< "$dependencies"); do
              npm pack "$package" --dry-run --prefer-online > /dev/null 2>&1 || return 1
            done
          }
          until is_served; do
            if [ "$SECONDS" -ge "$WATCH_SECONDS" ]; then
              echo "::notice::npm does not serve @evolu/relay@$VERSION and its @evolu dependencies yet, so nothing is pushed."
              echo "served=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "served=true" >> "$GITHUB_OUTPUT"

  push:
    name: Push relay image
    needs: version
    # A manual run whose image exists repairs its tags.
    if: >-
      needs.version.outputs.served == 'true' ||
      (github.event_name == 'workflow_dispatch' && needs.version.outputs.exists == 'true')
    runs-on: ubuntu-latest
    # Pushes of one version run one at a time, so they don't race on its tags.
    concurrency:
      group: relay-docker-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    # The environment holds the Docker Hub token, and only main can use it.
    environment: docker-hub
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Recheck on every attempt, including reruns of only this failed job.
      - name: Check Docker Hub for the relay version
        id: image
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/evoluhq/repositories/relay/tags/$VERSION")
          case "$status" in
            200)
              digest=$(jq -er '.digest | select(type == "string") | select(test("^sha256:[0-9a-f]{64}$"))' "$response")
              echo "$IMAGE:$VERSION already exists at $digest"
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Docker Hub lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # This job reads no Actions cache, as jobs on main that run dependency
      # code can write it. The QEMU setup would restore its binfmt image from it
      # by default, the Buildx setup would restore any buildx binary it
      # downloads, and the builds use no cache.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.image.outputs.published == 'false'
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Both images the push publishes, since each installs the SQLite addon of
      # its CPU from @evolu/nodejs. The arm64 one runs under QEMU.
      - name: Build amd64 image for the smoke test
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          platforms: linux/amd64
          load: true
          tags: evolu/relay:smoke-amd64

      - name: Build arm64 image for the smoke test
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          platforms: linux/arm64
          load: true
          tags: evolu/relay:smoke-arm64

      # Emulated, the arm64 relay takes longer to start, so each image gets 90
      # seconds to become healthy.
      - name: Smoke test on a custom port
        if: steps.image.outputs.published == 'false'
        run: |
          smoke() {
            local platform=$1
            local container
            container=$(docker run --detach --platform "linux/$platform" \
              --env PORT=4001 \
              --health-interval=1s --health-start-period=1s --health-retries=90 \
              "evolu/relay:smoke-$platform")
            local result=1
            for _ in $(seq 1 90); do
              case "$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")" in
                "running healthy")
                  docker exec "$container" test -s /app/data/evolu-relay.db && result=0
                  break
                  ;;
                "running starting")
                  sleep 1
                  ;;
                *)
                  break
                  ;;
              esac
            done
            if [ "$result" -ne 0 ]; then
              echo "::error::The $platform relay image didn't become healthy."
              docker logs "$container"
            fi
            docker rm --force --volumes "$container" >/dev/null
            return "$result"
          }
          smoke amd64
          smoke arm64

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - name: Push multi-arch image
        id: push
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Reconcile image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest || steps.push.outputs.digest }}
        run: |
          # A rerun of an older release must not move stable aliases backwards.
          git fetch --no-tags --depth=1 origin main
          current_version=$(git show FETCH_HEAD:apps/relay/package.json | jq -er .version)
          tags=()
          while IFS= read -r tag; do
            if [ "$current_version" != "$VERSION" ] && [ "$tag" != "$IMAGE:$VERSION" ]; then continue; fi
            if [ -n "$tag" ]; then tags+=("$tag"); fi
          done <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create --prefer-index=false \
            "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "### Relay image"
            echo
            for tag in "${tags[@]}"; do echo "- $tag"; done
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
