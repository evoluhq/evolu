name: Docker

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-docker
  cancel-in-progress: false

env:
  IMAGE: docker.io/evoluhq/relay

jobs:
  version:
    name: Relay version
    if: github.repository == 'evoluhq/evolu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read the relay version
        id: version
        run: |
          version=$(jq -r .version apps/relay/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  push:
    name: Push relay image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Recheck on every attempt, including reruns of only this failed job.
      - name: Check Docker Hub for the relay version
        id: image
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output "$response" --write-out '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/evoluhq/repositories/relay/tags/$VERSION")
          case "$status" in
            200)
              digest=$(jq -er '.digest | select(type == "string") | select(test("^sha256:[0-9a-f]{64}$"))' "$response")
              echo "$IMAGE:$VERSION already exists at $digest"
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Docker Hub lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Wait for npm to serve @evolu/relay@${{ env.VERSION }}
        if: steps.image.outputs.published == 'false'
        run: |
          for _ in $(seq 1 30); do
            if [ "$(npm view "@evolu/relay@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "@evolu/relay@$VERSION is not on npm"
          exit 1

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        if: steps.image.outputs.published == 'false'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build amd64 image for the smoke test
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@v7
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          load: true
          tags: evolu/relay:smoke
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

      - name: Smoke test on a custom port
        if: steps.image.outputs.published == 'false'
        run: |
          container=$(docker run --detach \
            --env PORT=4001 \
            --health-interval=1s --health-start-period=1s --health-retries=20 \
            evolu/relay:smoke)
          trap 'docker rm --force --volumes "$container" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            case "$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")" in
              "running healthy")
                docker exec "$container" test -s /app/data/evolu-relay.db
                exit 0
                ;;
              "running starting")
                sleep 1
                ;;
              *)
                break
                ;;
            esac
          done
          docker logs "$container"
          exit 1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - name: Push multi-arch image
        id: push
        if: steps.image.outputs.published == 'false'
        uses: docker/build-push-action@v7
        with:
          context: apps/relay
          build-args: RELAY_PACKAGE=@evolu/relay@${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay
          provenance: true
          sbom: true

      - uses: actions/attest@v4
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Reconcile image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest || steps.push.outputs.digest }}
        run: |
          # A rerun of an older release must not move stable aliases backwards.
          git fetch --no-tags --depth=1 origin main
          current_version=$(git show FETCH_HEAD:apps/relay/package.json | jq -er .version)
          args=()
          while IFS= read -r tag; do
            if [ "$current_version" != "$VERSION" ] && [ "$tag" != "$IMAGE:$VERSION" ]; then continue; fi
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=false \
            "${args[@]}" "$IMAGE@$DIGEST"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest || steps.push.outputs.digest }}
        run: |
          {
            echo "### Relay image"
            echo
            for tag in $TAGS; do echo "- $tag"; done
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
