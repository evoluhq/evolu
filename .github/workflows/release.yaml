name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # for manual triggering

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yaml

  select-mode:
    # Prevents release automation from running on forks.
    if: github.repository == 'evoluhq/evolu' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      # The version script also versions @evolu/sqlite-wasm by its SQLite
      # version, which Changesets cannot compute.
      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version

  # Nothing is packed before every React Native app job passes on the commit
  # being released.
  react-native-app:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    permissions:
      contents: read
    uses: ./.github/workflows/react-native-app.yaml
    with:
      without-expo: true
      static-frameworks: true

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, react-native-app]
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The prepack of @evolu/react-native writes native/ from the pinned
      # SQLite zip, which every use verifies, and the core.
      - name: Restore source archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      # The prepack of @evolu/sqlite-wasm, which pnpm pack runs, checks that
      # the wasm the Checks workflow built in this run is the pinned one and
      # copies it into the package.
      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Stages the packed releases on npm, where each becomes public only after a
  # maintainer approves it with two-factor authentication, which no token in CI
  # can do. Approve only what the stage step of a run on main staged, in its
  # order, which puts dependencies first, and only when every commit since the
  # last release is known. Any npm token with write access, such as the session
  # token of `npm login`, can stage a version too, so match each version to
  # that step's log: pass `npm stage approve` one stage ID it printed per
  # command, as npm 11 ignores further IDs, or on npmjs.com approve the version
  # whose shasum it printed together with a stage ID, as npm prints the shasum
  # before staging, also for a version it failed to stage. A run skips a tagged
  # version, so take a skipped version's ID from the log of the earlier run, or
  # the earlier attempt of the same run, on main that staged it. Reject a
  # version together with each staged version that depends on it. Each package's trusted
  # publisher allows only staging, only from the npm environment, which only
  # main can use, and the package requires 2FA and disallows tokens for
  # publishing. Never add --allow-publish:
  #   npm trust github <package> --repo evoluhq/evolu --file release.yaml --env npm --allow-stage-publish
  #   npm access set mfa=publish <package>
  # The job holding the OIDC token installs nothing and runs no lifecycle
  # scripts, so it runs no code from the repository's dependencies.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/pack

      # changesets/action creates the git tag and GitHub release of each staged
      # version without waiting for the approval.
      - name: Stage packages
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: node scripts/stage-packages.mts ${{ runner.temp }}/pack

      # changesets/action marks a release whose version has a hyphen as a
      # prerelease, as every @evolu/sqlite-wasm build (3.53.4-build1) has. The
      # stage step fails after staging some packages, and a rerun skips what was
      # staged, so this step runs even when the stage step failed.
      - name: Unmark the @evolu/sqlite-wasm prerelease
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          version=$(jq -r '.[] | select(.name == "@evolu/sqlite-wasm") | .version' <<<"$PUBLISHED")
          [ -z "$version" ] || gh release edit "@evolu/sqlite-wasm@$version" --prerelease=false --latest=false

  # Deploys the export that the Checks workflow's build-web job built to
  # Cloudflare. The job holding the token runs no code from the repository's
  # dependencies and restores no shared cache: its cone-mode sparse checkout
  # adds only apps/web/deploy and the files directly in apps and apps/web to
  # the root files, and it installs Wrangler from that directory's lockfile,
  # which pins every package by integrity.
  deploy-web:
    # Prevents deploying evolu.dev from forks.
    if: github.repository == 'evoluhq/evolu' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The environment holds the Cloudflare token (a secret) and account ID
    # (a variable), and only main can deploy to it.
    environment: evolu.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/web/deploy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      # apps/web/deploy/.npmrc turns off install scripts.
      - name: Install Wrangler
        working-directory: apps/web/deploy
        run: npm ci --no-audit --no-fund

      - name: Download web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps/web/out

      # Runs of main share the workflow's concurrency group, which keeps at
      # most one run pending: a newly queued run, such as a rerun of an older
      # one, cancels the pending run, and GitHub does not guarantee the order
      # runs start in. So only the commit main points to deploys, and an older
      # one skips. A failed lookup fails the step: the assignment exits under
      # bash -e, and --exit-code exits when main is missing. The commit becomes
      # the version's message in the Cloudflare dashboard, which lists versions
      # to roll back to.
      - name: Deploy
        working-directory: apps/web/deploy
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main)
          main=${main%%[[:space:]]*}
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $main, and only its Release run deploys. If that run was cancelled or failed, or the commit has [skip ci], run Release on main manually."
            exit 0
          fi
          ./node_modules/.bin/wrangler deploy --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
