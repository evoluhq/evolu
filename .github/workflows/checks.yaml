name: Checks

on:
  workflow_call:

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Monorepo lint
        run: pnpm lint:sherif

      - name: Oxlint
        run: pnpm lint:oxlint

  type-benchmarks:
    name: Type benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build

      - name: Check compiler benchmarks
        run: pnpm bench:type

  packages:
    name: Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build

      - name: Check packages
        run: pnpm check:packages

      - name: Test JSDoc
        run: pnpm test:jsdoc

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends jq

      - name: Build
        run: pnpm build

      - name: Test
        run: |
          pnpm test:unit
          pnpm test:integration:nodejs
          pnpm exec vitest run --coverage --mode=chromium --project='browser-*'
          pnpm test:bundle

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Test production playground
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The Playwright container runs as root, but GitHub otherwise sets HOME
      # to /github/home, which is owned by pwuser and breaks Firefox.
      HOME: /root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build

      - name: Test ${{ matrix.browser }}
        run: pnpm exec vitest run --mode=${{ matrix.browser }} --project='browser-*'
