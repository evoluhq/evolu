name: Checks

on:
  workflow_call:
    inputs:
      build-web:
        description: Builds the static export of evolu.dev as the `web` artifact.
        type: boolean
        default: false

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated SQLite bindings
        run: pnpm check:sqlite-wasm

      - name: Monorepo lint
        run: pnpm lint:sherif

      - name: Oxlint
        run: pnpm lint:oxlint

  # Builds packages/sqlite-wasm/wasm/sqlite3.wasm from pinned sources, for the
  # jobs that test it. The build fails when any input or the output differs
  # from its pin, so this job is also the test that the pinned build still
  # reproduces.
  sqlite-wasm:
    name: SQLite Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The official Emscripten image, pinned by the digest of its multi-arch
    # index. It sets EMSDK and has the host tools the build needs.
    container:
      image: emscripten/emsdk:6.0.3@sha256:bb0910e6a18bb9bd7cb31ae4ed40f9073148b78cb2cdb8ea8676454e0d85425c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # The build reproduces its pinned bytes or fails, so unchanged inputs
      # give the same wasm: this workflow, which pins the Emscripten image by
      # digest, the build script, which pins the source and the Emscripten
      # version, check-wasm.mts, which pins the output, and the lockfile,
      # which pins wabt. The cache is saved only after a build.
      - name: Restore built wasm
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-wasm/wasm
          key: sqlite-wasm-${{ hashFiles('.github/workflows/checks.yaml', 'packages/sqlite-wasm/scripts/build-wasm.mts', 'packages/sqlite-wasm/scripts/check-wasm.mts', 'pnpm-lock.yaml') }}

      # The build script holds the archive's pin, so a new pin gets a new
      # cache. The build verifies a cached archive against the pin anyway.
      - name: Cache source archive
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-wasm/wasm-cache
          key: sqlite-wasm-sources-${{ hashFiles('packages/sqlite-wasm/scripts/build-wasm.mts') }}

      # A failed build keeps its work directory, with the logs and the wasm
      # that differs from the pins, under TMPDIR.
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        run: node packages/sqlite-wasm/scripts/build-wasm.mts
        env:
          TMPDIR: ${{ runner.temp }}

      # The build checks the wasm's sha256 and the generator's pins. A
      # restored wasm is checked again, because nothing verifies what a cache
      # restores, and the generator's pins are not part of its key.
      - name: Verify restored wasm
        if: steps.built.outputs.cache-hit == 'true'
        run: |
          node packages/sqlite-wasm/scripts/check-wasm.mts
          node packages/sqlite-wasm/scripts/generate.mts --verify-build packages/sqlite-wasm/wasm/sqlite3.wasm

      - name: Upload failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlite-wasm-failed-build
          path: ${{ runner.temp }}/evolu-sqlite-wasm-*
          retention-days: 7

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlite-wasm
          path: |
            packages/sqlite-wasm/wasm/sqlite3.wasm
            packages/sqlite-wasm/wasm/build-info.json
          if-no-files-found: error

  type-benchmarks:
    name: Type benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build

      - name: Check compiler benchmarks
        run: pnpm bench:type

  protocol-benchmarks:
    name: Protocol benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Check protocol work
        run: pnpm bench:protocol

  packages:
    name: Packages
    # The packed @evolu/sqlite-wasm includes the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Build
        run: pnpm build

      - name: Check packages
        run: pnpm check:packages

      - name: Test JSDoc
        run: pnpm test:jsdoc

  coverage:
    name: Coverage
    # The integration tests load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends jq

      - name: Build
        run: pnpm build

      - name: Test
        run: |
          pnpm test:unit
          pnpm test:sqlite-wasm
          pnpm test:integration:nodejs
          pnpm exec vitest run --coverage --mode=chromium --project='browser-*'
          pnpm test:bundle

  e2e:
    name: Browser E2E (${{ matrix.browser }})
    # The playground's database worker loads the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each test replaces the relay at the one URL built into the app, so a job
    # runs its tests one at a time. A job per browser runs the browsers in
    # parallel, each building the app itself.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Test production playground
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    # The browser integration tests load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The Playwright container runs as root, but GitHub otherwise sets HOME
      # to /github/home, which is owned by pwuser and breaks Firefox.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Build
        run: pnpm build

      - name: Test ${{ matrix.browser }}
        run: pnpm exec vitest run --mode=${{ matrix.browser }} --project='browser-*'

  # Builds the export for the Release workflow's deploy-web job while the other
  # checks run, so a deploy waits for the slowest check, not for the checks and
  # then the build.
  build-web:
    name: Build web
    if: inputs.build-web
    # The playgrounds load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Build
        run: pnpm build:web

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: apps/web/out
          if-no-files-found: error
          retention-days: 1
