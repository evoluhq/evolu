name: Checks

on:
  workflow_call:

permissions: {}

env:
  FORCE_COLOR: 3

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated SQLite bindings
        run: pnpm check:sqlite-wasm

      - name: Monorepo lint
        run: pnpm lint:sherif

      - name: Oxlint
        run: pnpm lint:oxlint

  # Builds packages/sqlite-wasm/wasm/sqlite3.wasm from pinned sources, for the
  # jobs that test it. The build fails when any input or the output differs
  # from its pin, so this job is also the test that the pinned build still
  # reproduces.
  sqlite-wasm:
    name: SQLite Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The official Emscripten image, pinned by the digest of its multi-arch
    # index. It sets EMSDK and has the host tools the build needs.
    container:
      image: emscripten/emsdk:6.0.3@sha256:bb0910e6a18bb9bd7cb31ae4ed40f9073148b78cb2cdb8ea8676454e0d85425c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # The build reproduces its pinned bytes or fails, so unchanged inputs
      # give the same wasm: this workflow, which pins the Emscripten image by
      # digest, the build script, which pins the Emscripten version, the SQLite
      # core's sources and scripts, which pin the SQLite source and list the
      # core's compile units, check-wasm.mts, which pins the output, and the
      # lockfile, which pins wabt. hashFiles doesn't expand braces, so each
      # directory is its own pattern. The cache is saved only after a build.
      - name: Restore built wasm
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-wasm/wasm
          key: sqlite-wasm-${{ hashFiles('.github/workflows/checks.yaml', 'packages/sqlite-wasm/scripts/build-wasm.mts', 'packages/sqlite-wasm/scripts/check-wasm.mts', 'packages/sqlite-core/src/**', 'packages/sqlite-core/vendor/**', 'packages/sqlite-core/scripts/**', 'pnpm-lock.yaml') }}

      # sqlite-source.mts holds the archive's pin, so a new pin gets a new
      # cache, and a change to the core's C doesn't download the archive
      # again. The build verifies a cached archive against the pin anyway.
      - name: Cache source archive
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-wasm/wasm-cache
          key: sqlite-wasm-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts') }}

      # A failed build keeps its work directory, with the logs and the wasm
      # that differs from the pins, under TMPDIR.
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        run: node packages/sqlite-wasm/scripts/build-wasm.mts
        env:
          TMPDIR: ${{ runner.temp }}

      # The build checks the wasm's sha256 and the generator's pins. A
      # restored wasm is checked again, because nothing verifies what a cache
      # restores, and the generator's pins are not part of its key.
      - name: Verify restored wasm
        if: steps.built.outputs.cache-hit == 'true'
        run: |
          node packages/sqlite-wasm/scripts/check-wasm.mts
          node packages/sqlite-wasm/scripts/generate.mts --verify-build packages/sqlite-wasm/wasm/sqlite3.wasm

      - name: Upload failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-wasm-failed-build
          path: ${{ runner.temp }}/evolu-sqlite-wasm-*
          retention-days: 7

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-wasm
          path: |
            packages/sqlite-wasm/wasm/sqlite3.wasm
            packages/sqlite-wasm/wasm/build-info.json
          if-no-files-found: error

  # Builds Evolu's SQLite core in C with sanitizers on the host and runs its C
  # and TypeScript tests, whose C tests must cover every line, function and
  # branch of the core's C and its native binding layer compiled for the
  # runner's CPU and OS: x86-64 Linux, arm64 Linux, the hardware paths and CPU
  # detection Android shares, and arm64 macOS. The amalgamation comes from the
  # pinned SQLite source.
  sqlite-core:
    name: SQLite core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The crypto features each runner's CPU reports, as the tests'
        # EVOLU_CRYPTO_* mask: AES 1, SHA-512 2 and DIT 4. A runner that
        # reports another fails. GitHub's arm64 Linux runners report no DIT.
        include:
          - os: ubuntu-latest
            cpu: 1
          - os: ubuntu-24.04-arm
            cpu: 3
          - os: macos-latest
            cpu: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # Only the archives, SQLite's and expo-sqlite's, which every use verifies
      # against their pinned hashes, not what's generated from them.
      - name: Cache source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Test
        run: pnpm test:sqlite-core
        env:
          EVOLU_TEST_EXPECTED_CPU: ${{ matrix.cpu }}

      # The registry's thread tests under ThreadSanitizer, which can't
      # combine with AddressSanitizer.
      - name: Test threads
        if: matrix.os == 'ubuntu-latest'
        run: node packages/sqlite-core/scripts/test.mts binding_threads_ --thread-sanitizer

  # Android's armeabi-v7a and x86 ABIs build the core for 32-bit CPUs, without
  # hardware crypto, so the C tests also run built with -m32 and must cover all
  # of what that build compiles. It's a job of its own so it runs beside the
  # sqlite-core job's, not after them.
  sqlite-core-32-bit:
    name: SQLite core (32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # The archives, SQLite's and expo-sqlite's, as the sqlite-core job caches
      # them, which every use verifies against their pins.
      - name: Cache source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Install 32-bit libraries
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Test
        run: pnpm test:node --no-experimental-test-coverage packages/sqlite-core/test/core.test.mts
        env:
          EVOLU_TEST_M32: "1"
          EVOLU_TEST_EXPECTED_CPU: "0"

  # Checks the C that @evolu/react-native vendors from the SQLite core into
  # native/: that it matches native.json, the vendor script's tests, and that
  # every unit compiles for Android's four ABIs at API 24, React Native's
  # minSdk, with the NDK React Native pins and with the runner's newest, the
  # core and the binding layer with warnings as errors, so a libc function
  # newer than API 24 fails here, and leaves no global without the prefix
  # evolu_. The JSI adapter, cpp/EvoluSqliteBinding.cpp, compiles as C++20
  # with warnings as errors too, and its object may define only C++ of the
  # namespaces evolu, std and facebook and clang's helpers. It also runs React
  # Native's binding conformance suite on the core's N-API mirror
  # (node/binding.c), again built with AddressSanitizer and
  # UndefinedBehaviorSanitizer with the mirror's other tests and the driver's,
  # the TypeScript driver, the expo-sqlite migration tests
  # and the fixtures the device route seeds, the podspec under Ruby,
  # cpp/CMakeLists.txt under CMake, the device driver with a fake adb and
  # xcrun, and the package's src tests, with 100% coverage of scripts and
  # src/sqlite.
  react-native-native:
    name: React Native native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # The archives, SQLite's and expo-sqlite's, as the sqlite-core job caches
      # them, which every use verifies against their pins.
      - name: Cache source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Check vendored C
        run: node packages/react-native/scripts/vendor-native.mts --check

      - name: Test
        run: pnpm test:react-native-sqlite

      # The runner lacks the NDK React Native 0.88 pins. It isn't cached,
      # because jobs on main that run dependency code can write the Actions
      # cache, and nothing would verify a restored toolchain.
      - name: Install React Native's NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Vendor
        run: node packages/react-native/scripts/vendor-native.mts

      - name: Cross-compile with React Native's NDK
        run: node packages/react-native/scripts/vendor-native.mts --cross-compile=android --ndk="$ANDROID_HOME/ndk/27.1.12297006"

      - name: Cross-compile with the newest NDK
        run: node packages/react-native/scripts/vendor-native.mts --cross-compile=android --ndk="$ANDROID_NDK_LATEST_HOME"

  # The same cross-compile for the iOS device and both simulators, with Clang
  # modules and the podspec's C standard, as Xcode compiles. The vendor step
  # fails unless native/ matches native.json, so it checks that on macOS too.
  # Then the JSI adapter's Hermes tests run under AddressSanitizer and
  # UndefinedBehaviorSanitizer, then ThreadSanitizer, and gate their coverage
  # of the adapter. The image and Xcode are pinned, so an update of either
  # can't break unrelated pull requests under -Werror.
  react-native-apple:
    name: React Native Apple
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # Only SQLite's archive, which every use verifies against its pin.
      - name: Cache source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-core/sqlite-cache/*.zip
          key: react-native-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts') }}

      # The Hermes tarball, keyed by hermes.mts, which holds the pin every use
      # verifies.
      - name: Cache Hermes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/sqlite-core/sqlite-cache/hermes-ios-*.tar.gz
          key: react-native-hermes-${{ hashFiles('packages/react-native/scripts/hermes.mts') }}

      - name: Vendor
        run: node packages/react-native/scripts/vendor-native.mts

      - name: Cross-compile
        run: node packages/react-native/scripts/vendor-native.mts --cross-compile=ios

      # The JSI adapter under Hermes with AddressSanitizer and
      # UndefinedBehaviorSanitizer, then ThreadSanitizer, and its coverage.
      - name: Hermes tests
        run: pnpm test:react-native-hermes

  # Builds the SQLite addon @evolu/nodejs ships for each Linux target, in the
  # oldest system the target runs on, on a runner of its CPU: AlmaLinux 8,
  # whose glibc 2.28 is Node.js 24's oldest, and the relay image's Alpine for
  # musl. Both are pinned by the digest of their multi-arch index, but the
  # compiler is installed from the system's repository, which drops old builds,
  # so it isn't pinned, and the log records its packages. The build and check
  # scripts import only Node.js's own modules, so nothing is installed from
  # npm, and no dependency's code runs where the shipped addon is built. No
  # cache is restored either, which another job could have written: the build
  # downloads the pinned SQLite source and verifies it. The job then checks the
  # addon's header, which fails for a glibc symbol newer than 2.28, that it
  # exports only Node-API's entry points, that it loads as the package loads
  # it, opens an encrypted, a plaintext and a memory database and reads one
  # another implementation encrypted, and that a second build from a copy of
  # its sources at another path, into another build directory, gives the same
  # bytes. Reading another implementation's database catches a codec the
  # compiler broke in the crypto paths the runner's CPU takes, but not software
  # AES or arm64's software SHA-512, which only CPUs without those instructions
  # take. The release packs these addons.
  nodejs-native-linux:
    name: Node.js SQLite (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-musl
            runner: ubuntu-24.04
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The glibc build runs the Node.js of .nvmrc, an official build, which
      # runs on glibc 2.28 and installs the Node-API headers the build needs.
      # Alpine's image has its own, of the same version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      # JavaScript actions can't run in Alpine containers on arm64 runners, so
      # each build runs in its system with docker run.
      - name: Build and check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          volumes=(--volume="$PWD:/repo")
          case "$TARGET" in
            *-gnu)
              image=almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
              install="dnf install -y clang make unzip"
              volumes+=(--volume="$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro")
              ;;
            *-musl)
              image=node:24.22.0-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
              install="apk add --no-cache build-base clang unzip"
              ;;
          esac
          docker run --rm "${volumes[@]}" --workdir=/repo \
            --env=TARGET --env=INSTALL="$install" "$image" sh -euc '
              $INSTALL
              if [ -d /opt/node ]; then PATH=/opt/node/bin:$PATH; fi
              node --version
              clang --version
              if command -v rpm >/dev/null; then rpm -qa; else apk info -v; fi |
                grep -E "^(binutils|clang|glibc|llvm|musl)" | sort
              node packages/nodejs/scripts/build-native.mts --target="$TARGET"
              addon="packages/nodejs/native/$TARGET/evolu.node"
              nm -D --defined-only "$addon"
              # Alpine also defines the ELF init and fini functions.
              test "$(nm -D --defined-only "$addon" | awk "{ print \$3 }" |
                grep -vx -e _init -e _fini | sort | tr "\n" " ")" = \
                "napi_register_module_v1 node_api_module_get_api_version_v1 "
              node packages/nodejs/scripts/check-native.mts --target="$TARGET" --load --reproduce
            '

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-native-${{ matrix.target }}
          path: packages/nodejs/native/
          if-no-files-found: error

  # The same for both macOS targets, each on a runner of its CPU, for macOS
  # 13.5 and later, which the check reads from the addon's header, and with the
  # same second build. Xcode is pinned, to the version both images had as their
  # default, so an image update can't change the compiler. No runner with a
  # macOS older than 15 remains, so the oldest macOS isn't tested.
  nodejs-native-macos:
    name: Node.js SQLite (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Build and check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          xcodebuild -version
          clang --version
          node packages/nodejs/scripts/build-native.mts --target="$TARGET"
          addon="packages/nodejs/native/$TARGET/evolu.node"
          nm -gU "$addon"
          test "$(nm -gU "$addon" | awk '{ print $3 }' | sort | tr '\n' ' ')" = \
            "_napi_register_module_v1 _node_api_module_get_api_version_v1 "
          node packages/nodejs/scripts/check-native.mts --target="$TARGET" --load --reproduce

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-native-${{ matrix.target }}
          path: packages/nodejs/native/
          if-no-files-found: error

  type-benchmarks:
    name: Type benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build

      - name: Check compiler benchmarks
        run: pnpm bench:type

  protocol-benchmarks:
    name: Protocol benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      # The benchmark builds @evolu/nodejs's SQLite addon with the runner's
      # clang, from the pinned SQLite zip, which every use verifies.
      - name: Restore source archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Check protocol work
        run: pnpm bench:protocol

  packages:
    name: Packages
    # The packed @evolu/sqlite-wasm includes the SQLite wasm, and the packed
    # @evolu/nodejs every target's SQLite addon.
    needs: [sqlite-wasm, nodejs-native-linux, nodejs-native-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      # The prepack of @evolu/nodejs, which check:packages runs, checks every
      # target's addon and copies them into the package.
      - name: Download Node.js SQLite addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nodejs-native-*
          merge-multiple: true
          path: packages/nodejs/native

      # The prepack of @evolu/react-native, which check:packages runs, writes
      # native/ from the pinned SQLite zip, which every use verifies.
      - name: Restore source archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Build
        run: pnpm build

      - name: Check packages
        run: pnpm check:packages

      - name: Test JSDoc
        run: pnpm test:jsdoc

  tests:
    name: Tests (${{ matrix.suite }})
    # The integration tests load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each job pays for its container, install and build, so the suites are
    # grouped into a few jobs of similar length.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            run: pnpm test:unit && pnpm test:sqlite-wasm
          - suite: Node.js integration
            run: pnpm test:integration:nodejs
          - suite: browser integration and bundle
            run: pnpm exec vitest run --coverage --mode=chromium --project='browser-*' && pnpm test:bundle
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      # The unit tests run workflow scripts that use jq.
      - name: Install test dependencies
        if: matrix.suite == 'unit'
        run: apt-get update && apt-get install -y --no-install-recommends jq

      # The unit and Node.js integration tests run on Evolu's SQLite core,
      # whose addons they build with clang from the amalgamation that make
      # generates from the pinned SQLite zip, which every use verifies.
      - name: Install the SQLite core's build tools
        if: matrix.suite != 'browser integration and bundle'
        run: apt-get update && apt-get install -y --no-install-recommends clang make unzip

      - name: Restore source archives
        if: matrix.suite != 'browser integration and bundle'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/sqlite-core/sqlite-cache/*.zip
            packages/sqlite-core/sqlite-cache/*.tgz
          key: sqlite-core-sources-${{ hashFiles('packages/sqlite-core/scripts/sqlite-source.mts', 'packages/sqlite-core/test/sqlcipher.mts') }}

      - name: Build
        run: pnpm build

      - name: Test
        run: ${{ matrix.run }}

  e2e:
    name: Browser E2E (${{ matrix.browser }})
    # The playground's database worker loads the SQLite wasm, and the relay the
    # tests start from source loads @evolu/nodejs's SQLite addon.
    needs: [sqlite-wasm, nodejs-native-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each test replaces the relay at the one URL built into the app, so a job
    # runs its tests one at a time. A job per browser runs the browsers in
    # parallel, each building the app itself.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      # The Playwright image has no C compiler, so the job takes the addon the
      # linux-x64-gnu job built and checks that it loads before any test
      # starts a relay.
      - name: Download Node.js SQLite addon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodejs-native-linux-x64-gnu
          path: packages/nodejs/native

      - name: Check Node.js SQLite addon
        run: node packages/nodejs/scripts/check-native.mts --target=linux-x64-gnu --load

      - name: Test production playground
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 7

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    # The browser integration tests load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # Keep in sync with the Playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      # The Playwright container runs as root, but GitHub otherwise sets HOME
      # to /github/home, which is owned by pwuser and breaks Firefox.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Build
        run: pnpm build

      - name: Test ${{ matrix.browser }}
        run: pnpm exec vitest run --mode=${{ matrix.browser }} --project='browser-*'

  # Builds the whole export on every run, because the E2E jobs build it without
  # the API reference, and checks that a Worker accepts it before a merge. It
  # builds while the other checks run, so the Release workflow's deploy-web job,
  # which deploys it, waits for the slowest check, not for the checks and then
  # the build.
  build-web:
    name: Build web
    # The playgrounds load the SQLite wasm.
    needs: sqlite-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Download SQLite wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wasm
          path: packages/sqlite-wasm/wasm

      - name: Build
        run: pnpm build:web

      # On the Workers Free plan, a Worker version accepts at most 20,000 files
      # and no file over 25 MiB, and only the deploy, after a merge, would
      # reject the export.
      - name: Check Worker asset limits
        run: |
          count=$(find apps/web/out -type f | wc -l)
          echo "The export has $count files."
          if [ "$count" -gt 20000 ]; then
            echo "::error::The export has $count files, but a Worker version accepts at most 20,000."
            exit 1
          fi
          large=$(find apps/web/out -type f -size +25M)
          if [ -n "$large" ]; then
            echo "::error::A Worker version accepts no file over 25 MiB: $large"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/web/out
          if-no-files-found: error
          retention-days: 1
