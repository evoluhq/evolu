# Keeps the commit SHAs that workflows pin GitHub Actions to, and the digest
# the relay image's base is pinned to, up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # A release waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/apps/relay"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A new Node.js major goes with .nvmrc and is upgraded by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
