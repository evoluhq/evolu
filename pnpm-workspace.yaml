# While Expo doesn't require hoisted anymore, Electron still needs it.
# https://www.electronjs.org/docs/latest/tutorial/tutorial-first-app#initializing-your-npm-project
nodeLinker: hoisted

# Only packages set to true here may run install scripts. An install fails when
# an unlisted package has one, so each new entry is a decision.
allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true

# Installs take only versions published at least a day ago, when most malicious
# releases have been caught and removed, and no version published with weaker
# trust evidence than an earlier one, such as one missing the provenance its
# predecessors had. Setting the age makes pnpm enforce it strictly. Evolu's own
# packages install as soon as they are released, which examples switched to the
# published packages (pnpm examples:toggle-deps) need right after a release.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@evolu/*"
trustPolicy: no-downgrade
# Versions published with weaker evidence than an earlier version of the same
# package, each checked by hand. Each entry covers one version only.
trustPolicyExclude:
  # The npm team's 2023 security backports, after 7.5.4 had provenance.
  - semver@5.7.2
  - semver@6.3.1
  # Published by its maintainer without the provenance 4.0.1 had.
  - chokidar@4.0.3
  # Published by its maintainer the same day as 2.5.0, without its provenance.
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"

packages:
  - apps/*
  - packages/*
  - examples/*
  - bench/sqlite-comparison
  - bench/sqlite-comparison/react-native/app

tasks:
  dev:
    dependsOn:
      - ^build

overrides:
  react: 19.3.0
  react-dom: 19.3.0

catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: 19.3.0
    react-dom: 19.3.0
